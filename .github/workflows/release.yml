name: Release

# Builds a Release DMG. With the Developer ID and notarization secrets set (see
# docs/RELEASING.md), it signs, notarizes and staples the DMG and, for a tag, publishes a
# GitHub Release with it. Without them it builds an unsigned DMG, uploads it as a workflow
# artifact and stops successfully.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (X.Y.Z, no leading v). Empty: the one in Config/Base.xcconfig."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="$(sed -n -E 's/^MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]]+).*/\1/p' Config/Base.xcconfig)"
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Version '$version' is not of the form X.Y.Z (tags look like v1.2.3)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version, build $GITHUB_RUN_NUMBER"

      - name: Check for signing secrets
        id: secrets
        env:
          P12: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          KEY_P8: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$P12" ]] || missing+=(DEVELOPER_ID_CERT_P12_BASE64)
          [[ -n "$P12_PASSWORD" ]] || missing+=(DEVELOPER_ID_CERT_PASSWORD)
          [[ -n "$TEAM_ID" ]] || missing+=(APPLE_TEAM_ID)
          [[ -n "$KEY_ID" ]] || missing+=(NOTARY_KEY_ID)
          [[ -n "$ISSUER_ID" ]] || missing+=(NOTARY_ISSUER_ID)
          [[ -n "$KEY_P8" ]] || missing+=(NOTARY_KEY_P8_BASE64)
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "All signing secrets are set: building a signed, notarized release."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets missing (${missing[*]}): building an UNSIGNED DMG."
          fi

      # ---- Without secrets: unsigned build, uploaded as a workflow artifact ----------

      - name: Build unsigned DMG
        if: steps.secrets.outputs.signed != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release.sh --unsigned --version "$VERSION" --build-number "$GITHUB_RUN_NUMBER"

      - name: Upload unsigned DMG
        if: steps.secrets.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AutomationAgent-${{ steps.version.outputs.version }}-unsigned
          path: build/release/*.dmg
          if-no-files-found: error

      - name: Summary (unsigned)
        if: steps.secrets.outputs.signed != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MISSING: ${{ steps.secrets.outputs.missing }}
        run: |
          {
            echo "## Automation Agent $VERSION: UNSIGNED build"
            echo
            echo "This DMG is **not signed and not notarized**. Gatekeeper will block it, and"
            echo "macOS privacy permissions and the runner's XPC check need a signed app,"
            echo "so it is for inspection and testing only. No GitHub Release was created."
            echo
            echo "Missing secrets: \`$MISSING\`. See docs/RELEASING.md to add them."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- With secrets: signed, notarized, stapled, published ----------------------

      - name: Import the Developer ID certificate
        if: steps.secrets.outputs.signed == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          cert="$RUNNER_TEMP/developer-id.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          printf '%s' "$P12" | base64 --decode > "$cert"
          security import "$cert" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"
          # Let codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          # Put the temporary keychain first in the search list, keeping the others.
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line//\"/}"
            if [[ -n "$line" ]]; then existing+=("$line"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" ${existing[@]+"${existing[@]}"}

          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain" | grep -c "Developer ID Application" \
            || { echo "::error::The .p12 holds no Developer ID Application identity."; exit 1; }

      - name: Write the App Store Connect API key
        if: steps.secrets.outputs.signed == 'true'
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/notary-key.p8"
          ( umask 077; printf '%s' "$KEY_P8" | base64 --decode > "$key_path" )
          echo "NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and staple
        if: steps.secrets.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/release.sh --version "$VERSION" --build-number "$GITHUB_RUN_NUMBER"

      - name: Upload DMG
        if: steps.secrets.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AutomationAgent-${{ steps.version.outputs.version }}
          path: build/release/*.dmg
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: steps.secrets.outputs.signed == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dmg="build/release/AutomationAgent-$VERSION.dmg"
          [[ -f "$dmg" ]] || { echo "::error::$dmg not found"; exit 1; }
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$dmg" --clobber
          else
            # A tag like v1.0.0-beta.1 is published as a pre-release.
            prerelease=false
            if [[ "$TAG" == *-* ]]; then prerelease=true; fi
            gh release create "$TAG" "$dmg" --verify-tag --generate-notes \
              --title "Automation Agent $VERSION" --prerelease="$prerelease"
          fi

      - name: Summary (signed)
        if: steps.secrets.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Automation Agent $VERSION: signed and notarized"
            echo
            echo "The DMG is signed with Developer ID, notarized and stapled."
            if [[ "$IS_TAG" == "true" ]]; then
              echo "Published as the GitHub Release \`$TAG\`."
            else
              echo "Not a tag push, so no GitHub Release was created; the DMG is a workflow artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up the keychain and API key
        if: always()
        run: |
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/developer-id.p12"
